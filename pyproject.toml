[project]
name = "ceo-newsroom"
version = "3.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "sqlalchemy==2.1.4",
  "pydantic==2.13.4",
  "httpx==0.28.1",
  "feedparser==6.0.14",
  "APScheduler==3.11.3",
  "beautifulsoup4==4.15.0",
  "python-dotenv==1.2.3",
  "numpy==2.4.6",
  "Pillow==12.3.0",
  "tzdata==2026.3",
  "qrcode==8.2",
  "psycopg[binary]==3.3.6"
]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.fastapi.static]
cdn = false
